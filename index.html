<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Injective Portfolio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="menuBtn">☰</button>

<nav id="sideMenu">
  <div class="menu-item">Dashboard</div>
  <div class="menu-item">Tools</div>
  <div class="menu-item">Events</div>
</nav>

<header>
  <input id="addressInput" placeholder="Enter Injective address" />
  <button id="loadBtn">Load</button>
  <button id="refreshModeBtn">Refresh Mode</button>
</header>

<section class="card">
  <h2>INJ Price</h2>
  <div id="injPrice" class="price">0.00</div>
  <div id="bars" class="bars"></div>
</section>

<section class="card">
  <h2>Events</h2>
  <div id="events"></div>
  <button id="clearEvents">Clear</button>
</section>

<script src="app.js"></script>
</body>
</html>
